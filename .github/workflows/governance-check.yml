# Reusable AI Governance PR check (hosted in ADORSYS-GIS/ai-governance).
#
# What it enforces: every pull request body must contain
#   1. an "AI Usage Declaration" section,
#   2. a source-of-truth reference (a URL or #123 issue/PR reference, typically under
#      an Intent / Source of Truth / "It solves" section),
#   3. a "Verification" section with evidence (commands, links, or checked boxes).
#
# The check is lenient about formatting (case-insensitive, tolerates heading variations)
# but firm about presence. On failure it posts/updates a single sticky PR comment listing
# exactly what is missing.
#
# How repos opt in: add the caller workflow at .github/workflows/governance.yml
# (see templates/.github/workflows/governance.yml in this repo) which calls this with:
#   uses: ADORSYS-GIS/ai-governance/.github/workflows/governance-check.yml@main
#   permissions: { pull-requests: write, contents: read }
#
# Source of truth: https://adorsys-gis.github.io/ai-governance/
name: AI Governance Check

on:
  workflow_call:

jobs:
  governance-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check PR body for governance requirements
        uses: actions/github-script@v9
        with:
          script: |
            const STICKY_MARKER = '<!-- ai-governance-check -->';
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull_request in payload; nothing to check.');
              return;
            }

            const body = (pr.body || '');
            const lower = body.toLowerCase();
            const missing = [];

            // 1. AI Usage Declaration section.
            const hasAiDeclaration = /ai\s+usage\s+declaration/i.test(body);
            if (!hasAiDeclaration) {
              missing.push('an **AI Usage Declaration** section (declare whether/how AI was used).');
            }

            // 2. Source-of-truth reference: a URL or a #123 reference.
            // Be lenient — accept any http(s) URL or any #<number> issue/PR reference anywhere in the body.
            const hasUrl = /https?:\/\/\S+/i.test(body);
            const hasIssueRef = /#\d+/.test(body);
            if (!hasUrl && !hasIssueRef) {
              missing.push('a **source-of-truth reference** — a URL or a `#123` issue/PR reference (under Intent / Source of Truth / "It solves").');
            }

            // 3. Verification section with evidence.
            const hasVerificationHeading = /verification/i.test(body);
            const hasCheckedBox = /-\s*\[[xX]\]/.test(body);
            const hasCodeBlock = /```/.test(body);
            const hasEvidence = hasVerificationHeading && (hasCheckedBox || hasCodeBlock || hasUrl);
            if (!hasVerificationHeading) {
              missing.push('a **Verification** section.');
            } else if (!hasEvidence) {
              missing.push('**verification evidence** in the Verification section (checked boxes, commands/code blocks, or links).');
            }

            // Build / update the sticky comment.
            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            async function upsertComment(message) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(c => (c.body || '').includes(STICKY_MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: message });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: message });
              }
            }

            if (missing.length > 0) {
              const list = missing.map(m => `- ${m}`).join('\n');
              const message =
                `${STICKY_MARKER}\n` +
                `### ❌ AI Governance check failed\n\n` +
                `This PR description is missing the following governance requirements:\n\n` +
                `${list}\n\n` +
                `Please update the PR description using the ` +
                `[pull request template](https://adorsys-gis.github.io/ai-governance/04-pull-request-template) ` +
                `and re-run the check (edit the PR body).\n\n` +
                `> AI may accelerate the work, but it must not launder ignorance into polished artifacts.\n` +
                `> See: https://adorsys-gis.github.io/ai-governance/`;
              await upsertComment(message);
              core.setFailed('AI Governance check failed:\n' + missing.map(m => '  - ' + m.replace(/\*\*/g, '')).join('\n'));
            } else {
              const message =
                `${STICKY_MARKER}\n` +
                `### ✅ AI Governance check passed\n\n` +
                `This PR declares AI usage, references a source of truth, and provides verification evidence. Thank you.`;
              await upsertComment(message);
              core.info('AI Governance check passed.');
            }
