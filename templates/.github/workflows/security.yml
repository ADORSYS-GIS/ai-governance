# Per-repo caller workflow for the shared Trivy + Gitleaks security gates.
#
# Drop this file at .github/workflows/security.yml in a consuming repo to opt in.
# It delegates to the reusable workflow hosted in ADORSYS-GIS/ai-governance, which
# runs a Gitleaks secret scan and a Trivy vulnerability/misconfiguration scan.
#
# The reusable workflow is pinned to an immutable commit SHA, not @main or a movable
# tag, so a future push to ai-governance cannot change what runs here with write
# access. Bump the SHA deliberately when adopting a new security-gates release.
#
# Source of truth: https://adorsys-gis.github.io/ai-governance/
name: Security Audit

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    # ADORSYS-GIS/ai-governance @ #27
    uses: ADORSYS-GIS/ai-governance/.github/workflows/security-gates.yml@b0798a3b7218a21bd807405551fc6c73b63693b4
    secrets: inherit
    with:
      trivy-scan-type: 'fs'
      trivy-target: '.'
      # Runs on GitHub-hosted ubuntu-latest by default. To run on your own
      # runners (e.g. because the calling repo is private and billing-blocked
      # on GitHub-hosted minutes), set:
      # runs-on: <your-self-hosted-runner-label>
